description: |-
  ## Parent

  PRD-001 ([prd-cli-setup.md](../prd-cli-setup.md))

  ## What to build

  Configure `tsup` to bundle the TypeScript CLI tool into executable standalone distribution files.

  Set up `tsup.config.ts` targeting Node.js, compiling `src/cli.ts` into `dist/cli.js` with shebang (`#!/usr/bin/env node`) preserved and ESM output. Configure package binary definition (`"bin": { "plainpm": "dist/cli.js" }`) and provide `npm run build` and `npm run dev` development scripts. Verify that running `npm run build` produces a valid executable file in `dist/`.

  ## Acceptance criteria

  - [x] `tsup` configured for ESM output, bundling `src/cli.ts` to `dist/cli.js`.
  - [x] Shebang line preserved on built binary.
  - [x] `bin` entry added to `package.json`.
  - [x] `npm run build` and direct execution of `dist/cli.js` succeed.

  ## Blocked by

  - PRD-001-001
