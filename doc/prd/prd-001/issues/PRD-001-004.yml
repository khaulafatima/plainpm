description: |-
  ## Parent

  PRD-001 ([prd-cli-setup.md](../prd-cli-setup.md))

  ## What to build

  Integrate Yargs as the CLI routing engine and wire end-to-end integration tests.

  Configure Yargs to parse command-line arguments, configure script name as `plainpm`, handle unknown commands gracefully, provide descriptive `--help`, and report package `--version`. Construct integration tests under Jest that exercise the command dispatcher (both programmatically and via CLI process execution) to verify external CLI behavior.

  ## Acceptance criteria

  - [x] `yargs` installed and integrated into `src/cli.ts`.
  - [x] Running `plainpm --help` displays command usage, options, and descriptions.
  - [x] Running `plainpm --version` prints current version from `package.json`.
  - [x] End-to-end tests in Jest verify `--help` and CLI dispatch behavior cleanly.

  ## Blocked by

  - PRD-001-002
  - PRD-001-003
