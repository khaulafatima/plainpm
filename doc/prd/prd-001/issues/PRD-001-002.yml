description: |-
  ## Parent

  PRD-001 ([prd-cli-setup.md](../prd-cli-setup.md))

  ## What to build

  Configure Jest test runner with TypeScript and ES Module support (`ts-jest/presets/default-esm`).

  The test runner must natively execute TypeScript tests written against ESM source files without requiring pre-compilation steps. Set up `jest.config.ts` (or `jest.config.js`), ensure Node experimental VM modules or proper ts-jest ESM transformers are wired into `npm test`, and provide a passing sanity test verifying that module imports and Jest assertions execute properly.

  ## Acceptance criteria

  - [x] Jest, `ts-jest`, and `@types/jest` installed and configured.
  - [x] Support for ESM `.ts` file imports in tests without module resolution errors.
  - [x] `npm test` runs and passes.

  ## Blocked by

  - PRD-001-001
