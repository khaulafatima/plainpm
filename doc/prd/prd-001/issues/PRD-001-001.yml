description: |-
  ## Parent

  PRD-001 ([prd-cli-setup.md](../prd-cli-setup.md))

  ## What to build

  Establish the core repository TypeScript and modern linting pipeline for PlainPM using Node.js LTS and ES Modules.

  Configure the project root with pure ESM (`"type": "module"`), strict TypeScript compiler options (`tsconfig.json` targeting `NodeNext`), and modern automated code formatting and linting via `@antfu/eslint-config`. Provide standard npm scripts (`lint`, `lint:fix`, `typecheck`) and a minimal TypeScript source file to prove the pipeline passes end-to-end.

  ## Acceptance criteria

  - [x] `package.json` updated with `"type": "module"` and appropriate scripts.
  - [x] `tsconfig.json` configured for strict TypeScript compilation with NodeNext module resolution.
  - [x] `@antfu/eslint-config` installed and configured in flat config (`eslint.config.js`).
  - [x] `npm run lint` and `npm run typecheck` run cleanly.

  ## Blocked by

  None - can start immediately.
